<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo MW2 Conexión Directa</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #84cc16;
            --bg: #0f172a;
            --card: #1e293b;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }
        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 2px; color: #94a3b8; }
        .display {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
            background: #020617;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        #clase-txt { font-size: 0.9rem; color: var(--primary); margin-bottom: 5px; }
        #arma-txt { font-size: 1.5rem; font-weight: bold; min-height: 1.8rem; }
        
        button {
            background-color: var(--primary);
            color: #052e16;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            margin-top: 10px;
        }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .glow { animation: blink 0.3s ease-in-out 3; }
        @keyframes blink { 50% { opacity: 0.3; color: var(--primary); } }
        
        .hidden { display: none !important; }
        #admin-panel { margin-top: 15px; border-top: 1px dashed #475569; padding-top: 15px; }
        input {
            width: 80%;
            padding: 10px;
            background: #020617;
            border: 1px solid #334155;
            color: white;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="titulo">Sorteo MW2 P2P</h2>
        
        <div class="display">
            <div id="clase-txt">INICIALIZANDO...</div>
            <div id="arma-txt">----</div>
        </div>

        <div id="setup-panel">
            <p id="mi-id-txt" style="font-size:0.8rem; color:#94a3b8;"></p>
            <input type="text" id="sala-input" placeholder="Código del Comandante">
            <button onclick="conectarAComandante()">Unirse a Sala</button>
            <button style="background:#334155; color:white;" onclick="activarModoComandante()">Crear Sala (Admin)</button>
        </div>

        <div id="admin-panel" class="hidden">
            <p style="font-size:0.7rem; color:#84cc16;">Competidores conectados: <span id="contador">0</span></p>
            <button id="btn-sorteo" onclick="enviarSorteoAlMundo()">Desplegar Equipo</button>
        </div>
    </div>

    <script>
        const arsenal = {
            "Fusiles de asalto": ["M4", "TAQ-56", "Kastov 762", "Lachmann-556", "STB 556", "M13B", "Chimera", "Kastov 545", "Kastov-74u", "M16", "ISO Hemlock", "Tempus Razorback", "FR Avancer", "TR-76 Geist"],
            "Fusiles de combate": ["Lachmann-762", "SO-14", "TAQ-V", "FTAC Recon", "Cronen Squall"],
            "Subfusiles": ["VEL 46", "MX9", "Lachmann Sub", "Vaznev-9K", "FSS Hurricane", "Minibak", "PDSW 528", "Fennec 45", "BAS-P", "ISO 45", "Lachmann Shroud", "ISO 9mm"],
            "Escopetas": ["Lockwood 300", "Expedite 12", "Bryson 800", "Bryson 890", "KV Broadside", "MX Guardian"],
            "Ametralladoras ligeras": ["Sakin MG38", "HCR 56", "556 Icarus", "Raal MG", "RPK", "RAPP H"],
            "Fusiles tácticos": ["EBR-14", "SP-R 208", "Lockwood MK2", "LMS", "SA-B 50", "TAQ-M", "Tempus Torrent"],
            "Fusiles de precisión": ["MCPR-300", "Victus XMR", "Signal 50", "LA-B 330", "SP-X 80", "FJX Imperium", "Carrack .300"],
            "Pistolas": ["P890", "X12", "X13 Auto", ".50 GS", "Basilisk", "FTAC Siege", "GS Magna", "9mm Daemon"]
        };

        let peer;
        let conexiones = [];
        let miRol = 'espectador';

        // Generamos un código de sala aleatorio de 4 dígitos para que sea fácil de pasar por WhatsApp
        const codigoSala = Math.floor(1000 + Math.random() * 9000).toString();

        // Inicializar la conexión P2P nativa
        peer = new Peer('mw2-' + codigoSala);

        peer.on('open', (id) => {
            document.getElementById('clase-txt').innerText = "LISTO";
            document.getElementById('arma-txt').innerText = "CREA O ÚNETE";
            document.getElementById('mi-id-txt').innerText = "Tu Código Base: " + codigoSala;
        });

        peer.on('error', (err) => {
            // Si el código ya existe por azar, reconectamos de forma genérica
            if(err.type === 'unavailable-id') {
                alert("El código de sala ya está en uso, refresca la página.");
            }
        });

        // El Administrador escucha las conexiones entrantes de los jugadores
        function activarModoComandante() {
            miRol = 'admin';
            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('titulo').innerText = "SALA: " + codigoSala;
            document.getElementById('clase-txt').innerText = "SALA ABIERTA";
            document.getElementById('arma-txt').innerText = "PASA EL CÓDIGO: " + codigoSala;

            peer.on('connection', (conn) => {
                conexiones.push(conn);
                document.getElementById('contador').innerText = conexiones.length;
                
                // Si el admin tira el sorteo, le llegará a esta conexión
                conn.on('open', () => {
                    console.log("Competidor conectado con éxito.");
                });
            });
        }

        // El Competidor se une usando el código del Admin
        function conectarAComandante() {
            const salaDestino = document.getElementById('sala-input').value.trim();
            if(!salaDestino) return alert("Escribe el código de sala de tu comandante.");

            document.getElementById('clase-txt').innerText = "CONECTANDO...";
            
            const conn = peer.connect('mw2-' + salaDestino);
            
            conn.on('open', () => {
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('titulo').innerText = "UNIDO A SALA " + salaDestino;
                document.getElementById('clase-txt').innerText = "SINCRONIZADO";
                document.getElementById('arma-txt').innerText = "ESPERANDO ORDEN...";
            });

            conn.on('data', (data) => {
                // Al recibir los datos directos del admin, arranca la animación
                ejecutarAnimacionVisual(data.clase, data.arma);
            });
        }

        // El admin genera el resultado y lo empuja DIRECTO a cada teléfono conectado
        function enviarSorteoAlMundo() {
            if(miRol !== 'admin' || conexiones.length === 0) {
                return alert("Esperando a que se conecte al menos un competidor.");
            }

            const clases = Object.keys(arsenal);
            const claseFinal = clases[Math.floor(Math.random() * clases.length)];
            const armasFinales = arsenal[claseFinal];
            const armaFinal = armasFinales[Math.floor(Math.random() * armasFinales.length)];

            // Enviamos los datos directamente a cada conexión guardada
            conexiones.forEach(conn => {
                if(conn.open) {
                    conn.send({ clase: claseFinal, arma: armaFinal });
                }
            });

            // El admin también lo ve reflejado
            ejecutarAnimacionVisual(claseFinal, armaFinal);
        }

        function ejecutarAnimacionVisual(claseFinal, armaFinal) {
            const claseEl = document.getElementById('clase-txt');
            const armaEl = document.getElementById('arma-txt');
            const clases = Object.keys(arsenal);
            
            armaEl.classList.remove('glow');
            let iteraciones = 0;
            const maxIteraciones = 25; 

            const intervalo = setInterval(() => {
                const claseRandom = clases[Math.floor(Math.random() * clases.length)];
                const armasRandom = arsenal[claseRandom];
                const armaRandom = armasRandom[Math.floor(Math.random() * armasRandom.length)];

                claseEl.innerText = claseRandom;
                armaEl.innerText = armaRandom;

                iteraciones++;

                if (iteraciones >= maxIteraciones) {
                    clearInterval(intervalo);
                    claseEl.innerText = claseFinal;
                    armaEl.innerText = armaFinal;
                    armaEl.classList.add('glow');
                }
            }, 60);
        }
    </script>
</body>
</html>
