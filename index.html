<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo MW2 Sincronizado</title>
    <script src="https://unpkg.com/piesocket-js@2"></script>
    <style>
        :root {
            --primary: #84cc16;
            --bg: #0f172a;
            --card: #1e293b;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }
        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        h2 { font-size: 1.2rem; margin-bottom: 20px; letter-spacing: 2px; color: #94a3b8; }
        .display {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
            background: #020617;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        #clase-txt { font-size: 0.9rem; color: var(--primary); margin-bottom: 5px; }
        #arma-txt { font-size: 1.5rem; font-weight: bold; min-height: 1.8rem; }
        
        button {
            background-color: var(--primary);
            color: #052e16;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        .glow { animation: blink 0.3s ease-in-out 3; }
        @keyframes blink { 50% { opacity: 0.3; color: var(--primary); } }
        
        .hidden { display: none !important; }
        #admin-panel { margin-top: 15px; border-top: 1px dashed #475569; padding-top: 15px; }
        .btn-rol { background: #334155; color: white; margin-top: 10px; font-size: 0.8rem; padding: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="titulo">Sorteo MW2</h2>
        
        <div class="display">
            <div id="clase-txt">CONECTANDO...</div>
            <div id="arma-txt">----</div>
        </div>

        <div id="admin-panel" class="hidden">
            <button id="btn-sorteo" onclick="enviarSorteoAlMundo()">Desplegar Equipo</button>
        </div>

        <div id="setup-panel">
            <button class="btn-rol" onclick="definirRol('espectador')">Unirse como Competidor</button>
            <button class="btn-rol" style="background:#1e293b; color:#64748b;" onclick="definirRol('admin')">Acceso Comandante</button>
        </div>
    </div>

    <script>
        // === CONFIGURACIÓN DE PIESOCKET (TUS LLAVES INTEGRADAS) ===
        const PIESOCKET_API_KEY = 'CEKsrD9XeUYnrqVisFHUhdYelJOTa1W3j7KvpZTj';
        const PIESOCKET_CLUSTER_ID = 'free.blr2'; 

        const arsenal = {
            "Fusiles de asalto": ["M4", "TAQ-56", "Kastov 762", "Lachmann-556", "STB 556", "M13B", "Chimera", "Kastov 545", "Kastov-74u", "M16", "ISO Hemlock", "Tempus Razorback", "FR Avancer", "TR-76 Geist"],
            "Fusiles de combate": ["Lachmann-762", "SO-14", "TAQ-V", "FTAC Recon", "Cronen Squall"],
            "Subfusiles": ["VEL 46", "MX9", "Lachmann Sub", "Vaznev-9K", "FSS Hurricane", "Minibak", "PDSW 528", "Fennec 45", "BAS-P", "ISO 45", "Lachmann Shroud", "ISO 9mm"],
            "Escopetas": ["Lockwood 300", "Expedite 12", "Bryson 800", "Bryson 890", "KV Broadside", "MX Guardian"],
            "Ametralladoras ligeras": ["Sakin MG38", "HCR 56", "556 Icarus", "Raal MG", "RPK", "RAPP H"],
            "Fusiles tácticos": ["EBR-14", "SP-R 208", "Lockwood MK2", "LMS", "SA-B 50", "TAQ-M", "Tempus Torrent"],
            "Fusiles de precisión": ["MCPR-300", "Victus XMR", "Signal 50", "LA-B 330", "SP-X 80", "FJX Imperium", "Carrack .300"],
            "Pistolas": ["P890", "X12", "X13 Auto", ".50 GS", "Basilisk", "FTAC Siege", "GS Magna", "9mm Daemon"]
        };

        // Inicializar PieSocket
        const piesocket = new PieSocket.default({
            clusterId: PIESOCKET_CLUSTER_ID,
            apiKey: PIESOCKET_API_KEY
        });

        // NOTA: Cambiado a canal "public-sorteo" para habilitar el envío directo desde web
        let canal;
        piesocket.subscribe("public-sorteo").then(ch => {
            canal = ch;
            document.getElementById('clase-txt').innerText = "CONECTADO";
            document.getElementById('arma-txt').innerText = "ELIJA SU ROL ABAJO";

            // Escuchador de red para todos los dispositivos conectados
            canal.on('message', function(msg){
                const data = JSON.parse(msg.data);
                ejecutarAnimacionVisual(data.clase, data.arma);
            });
        });

        function definirRol(rol) {
            document.getElementById('setup-panel').classList.add('hidden');
            
            if (rol === 'admin') {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('titulo').innerText = "MODO COMANDANTE";
                document.getElementById('clase-txt').innerText = "SALA CONTROLADA";
                document.getElementById('arma-txt').innerText = "LISTO PARA DESPLEGAR";
            } else {
                document.getElementById('titulo').innerText = "COMPETIDOR UNIDO";
                document.getElementById('clase-txt').innerText = "SINCRONIZADO";
                document.getElementById('arma-txt').innerText = "ESPERANDO ORDEN...";
            }
        }

        // Envío directo corregido hacia el canal público
        function enviarSorteoAlMundo() {
            if (!canal) return;

            const clases = Object.keys(arsenal);
            const claseFinal = clases[Math.floor(Math.random() * clases.length)];
            const armasFinales = arsenal[claseFinal];
            const armaFinal = armasFinales[Math.floor(Math.random() * armasFinales.length)];

            // Publicamos los datos estructurados en formato JSON strings
            canal.send(JSON.stringify({
                clase: claseFinal,
                arma: armaFinal
            }));
        }

        function ejecutarAnimacionVisual(claseFinal, armaFinal) {
            const claseEl = document.getElementById('clase-txt');
            const armaEl = document.getElementById('arma-txt');
            const clases = Object.keys(arsenal);
            
            armaEl.classList.remove('glow');
            let iteraciones = 0;
            const maxIteraciones = 25; 

            const intervalo = setInterval(() => {
                const claseRandom = clases[Math.floor(Math.random() * clases.length)];
                const armasRandom = arsenal[claseRandom];
                const armaRandom = armasRandom[Math.floor(Math.random() * armasRandom.length)];

                claseEl.innerText = claseRandom;
                armaEl.innerText = armaRandom;

                iteraciones++;

                if (iteraciones >= maxIteraciones) {
                    clearInterval(intervalo);
                    claseEl.innerText = claseFinal;
                    armaEl.innerText = armaFinal;
                    armaEl.classList.add('glow');
                }
            }, 60);
        }
    </script>
</body>
</html>
